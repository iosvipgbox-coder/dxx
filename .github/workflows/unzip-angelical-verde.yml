name: Mover Conteudo GBOXIOSVIP-verdvisual-app para a Raiz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move_to_root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move contents from GBOXIOSVIP-verdvisual-app to root
        run: |
          TARGET_DIR="GBOXIOSVIP-verdvisual-app"
          if [ -d "$TARGET_DIR" ]; then
            echo "A mover o conteúdo de $TARGET_DIR diretamente para a raiz..."
            shopt -s dotglob
            
            # Copia todos os ficheiros e pastas de dentro para a raiz (.)
            cp -r "$TARGET_DIR"/* ./ 2>/dev/null || true
            cp -r "$TARGET_DIR"/.* ./ 2>/dev/null || true
            
            # Remove a pasta original
            rm -rf "$TARGET_DIR"
            echo "Conteúdo movido com sucesso e pasta antiga removida!"
          else
            echo "Erro: A pasta $TARGET_DIR não foi encontrada na raiz do repositório!"
            exit 1
          fi

      - name: Commit changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detetada para commit."
          else
            git commit -m "Fix: Move tudo de GBOXIOSVIP-verdvisual-app diretamente para a raiz"
            git push
          fi
